name: Multi-Platform Build & Release

on:
  push:
    tags: [ '**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  # ==========================================
  # 1. Android ARM (arm64-v8a & armeabi-v7a)
  # ==========================================
  build-android:
    name: Android (ARM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Android Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少 repository secret: $name"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build APKs (Per ABI)
        # 分包与通用包共用同一个 versionCode：否则先装分包再装通用包会被判为降级。
        run: flutter build apk --release --split-per-abi -P force-version-code-ignoring-abi=true

      - name: Stage APKs
        run: |
          mkdir -p dist
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/arknights_story_player-v${version}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/arknights_story_player-v${version}-android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/arknights_story_player-v${version}-android-x64.apk"

      - name: Build Universal APK
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "dist/arknights_story_player-v${version}-android-universal.apk"

      - name: Verify APK Signatures
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner=$(find "${sdk_root}/build-tools" -maxdepth 2 \( -type f -o -type l \) -name 'apksigner*' 2>/dev/null | sort -V | tail -1)
          if [ ! -f "$apksigner" ]; then
            echo "::error::未找到 apksigner（SDK 根目录: ${sdk_root:-<未设置>}）"
            exit 1
          fi
          echo "apksigner: $apksigner"
          echo "apksigner 版本: $("$apksigner" version 2>&1 | tr -d '\r')"
          expected=$(keytool -list -v -keystore android/app/upload-keystore.jks \
            -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            | sed -n 's/^.*SHA256: //p' | head -1 | tr -d ':\r ' | tr 'A-Z' 'a-z')
          [ -n "$expected" ] || { echo "::error::无法从密钥库读取证书 SHA-256"; exit 1; }
          for apk in dist/*.apk; do
            if ! report=$("$apksigner" verify --print-certs "$apk" 2>&1); then
              echo "::error::$apk 签名校验未通过"
              printf '%s\n' "$report"
              exit 1
            fi
            actual=$(printf '%s\n' "$report" | sed -n 's/^.*SHA-256 digest: *//p' | head -1 | tr -d ':\r ' | tr 'A-Z' 'a-z')
            signers=$(printf '%s\n' "$report" | grep -c 'SHA-256 digest:' || true)
            if [ "$signers" -ne 1 ] || [ "$actual" != "$expected" ]; then
              echo "::error::$apk 的签名与上传密钥库不一致（可能是 debug 签名）"
              echo "expected: $expected"
              echo "actual: ${actual:-<空>}（签名者数量: $signers）"
              printf '%s\n' "$report"
              exit 1
            fi
            echo "签名校验通过: $apk -> $actual"
          done
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-arm-apks
          path: dist/*.apk

  # ==========================================
  # 2. Windows (x64)
  # ==========================================
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Package Windows Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: ([^+]+)').Matches.Groups[1].Value
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\arknights_story_player-v$version-windows-x64.zip"
      - name: Build Windows Installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: ([^+]+)').Matches.Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-bundle
          path: dist/arknights_story_player-*-windows-x64*

  # ==========================================
  # 3. Linux (x86_64)
  # ==========================================
  build-linux-x64:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux (x64)
        run: flutter build linux --release

      - name: Test Linux Packaging
        run: bash packaging/linux/package_test.sh

      - name: Package Linux Releases
        run: bash packaging/linux/package.sh x64

      - name: Upload Linux x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-bundle
          path: dist/arknights_story_player-*-linux-x64*

  # ==========================================
  # 4. Linux (ARM64)
  # ==========================================
  build-linux-arm64:
    name: Linux (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux (ARM64)
        run: flutter build linux --release

      - name: Package Linux Releases
        run: bash packaging/linux/package.sh arm64

      - name: Upload Linux ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-bundle
          path: dist/arknights_story_player-*-linux-arm64*

  # ==========================================
  # 5. tag 推送构建成功后，发布该 tag 的 Release。
  # ==========================================
  release:
    name: Publish Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-android, build-windows, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Organize Release Assets
        run: |
          mkdir -p release-assets
          find all-artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Pick Release Notes
        id: release_notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NOTE_FILE=".github/release-notes/${RELEASE_TAG}.md"
          if [ -f "$NOTE_FILE" ]; then
            echo "body_path=$NOTE_FILE" >> "$GITHUB_OUTPUT"
            echo "generate_release_notes=false" >> "$GITHUB_OUTPUT"
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "generate_release_notes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: ${{ steps.release_notes.outputs.generate_release_notes }}
          body_path: ${{ steps.release_notes.outputs.body_path }}
