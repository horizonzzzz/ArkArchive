name: Multi-Platform Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. Android ARM (arm64-v8a & armeabi-v7a)
  # ==========================================
  build-android:
    name: Android (ARM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Split ABI for ARM)
        run: flutter build apk --release --split-per-abi

      - name: Stage Artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/arknights_story_player-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/arknights_story_player-android-armeabi-v7a.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-arm-apks
          path: dist/*.apk

  # ==========================================
  # 2. Windows (x64)
  # ==========================================
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Package Windows Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\arknights_story_player-windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-bundle
          path: dist/arknights_story_player-windows-x64.zip

  # ==========================================
  # 3. Linux (x86_64)
  # ==========================================
  build-linux-x64:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux (x64)
        run: flutter build linux --release

      - name: Package Linux Bundle
        run: |
          mkdir -p dist
          tar -czf dist/arknights_story_player-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-bundle
          path: dist/arknights_story_player-linux-x64.tar.gz

  # ==========================================
  # 4. Linux (ARM64)
  # Note: Uses QEMU + Docker so it works across both private and public repos.
  # (If the repository is public or has paid ARM runners, runs-on can be switched to ubuntu-24.04-arm)
  # ==========================================
  build-linux-arm64:
    name: Linux (ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Linux ARM64 in Docker
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/cirruslabs/flutter:stable \
            bash -c "
              git config --global --add safe.directory /workspace && \
              apt-get update && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev && \
              flutter config --no-analytics && \
              flutter pub get && \
              flutter build linux --release && \
              mkdir -p dist && \
              tar -czf dist/arknights_story_player-linux-arm64.tar.gz -C build/linux/arm64/release/bundle . && \
              chmod 666 dist/arknights_story_player-linux-arm64.tar.gz
            "

      - name: Upload Linux ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-bundle
          path: dist/arknights_story_player-linux-arm64.tar.gz

  # ==========================================
  # 5. Release Publication (triggers on Git tags 'v*')
  # ==========================================
  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-windows, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Organize Release Assets
        run: |
          mkdir -p release-assets
          find all-artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
