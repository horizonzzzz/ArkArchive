name: Multi-Platform Build & Release

on:
  push:
    tags: [ '**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  # ==========================================
  # 1. Android ARM (arm64-v8a & armeabi-v7a)
  # ==========================================
  build-android:
    name: Android (ARM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APKs (Per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Stage APKs
        run: |
          mkdir -p dist
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/arknights_story_player-v${version}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/arknights_story_player-v${version}-android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/arknights_story_player-v${version}-android-x64.apk"

      - name: Build Universal APK
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "dist/arknights_story_player-v${version}-android-universal.apk"
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-arm-apks
          path: dist/*.apk

  # ==========================================
  # 2. Windows (x64)
  # ==========================================
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Package Windows Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: ([^+]+)').Matches.Groups[1].Value
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\arknights_story_player-v$version-windows-x64.zip"
      - name: Build Windows Installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: ([^+]+)').Matches.Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-bundle
          path: dist/arknights_story_player-*-windows-x64*

  # ==========================================
  # 3. Linux (x86_64)
  # ==========================================
  build-linux-x64:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux (x64)
        run: flutter build linux --release

      - name: Test Linux Packaging
        run: bash packaging/linux/package_test.sh

      - name: Package Linux Releases
        run: bash packaging/linux/package.sh x64

      - name: Upload Linux x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-bundle
          path: dist/arknights_story_player-*-linux-x64*

  # ==========================================
  # 4. Linux (ARM64)
  # ==========================================
  build-linux-arm64:
    name: Linux (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux (ARM64)
        run: flutter build linux --release

      - name: Package Linux Releases
        run: bash packaging/linux/package.sh arm64

      - name: Upload Linux ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-bundle
          path: dist/arknights_story_player-*-linux-arm64*

  # ==========================================
  # 5. tag 推送构建成功后，发布该 tag 的 Release。
  # ==========================================
  release:
    name: Publish Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-android, build-windows, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Organize Release Assets
        run: |
          mkdir -p release-assets
          find all-artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Pick Release Notes
        id: release_notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NOTE_FILE=".github/release-notes/${RELEASE_TAG}.md"
          if [ -f "$NOTE_FILE" ]; then
            echo "body_path=$NOTE_FILE" >> "$GITHUB_OUTPUT"
            echo "generate_release_notes=false" >> "$GITHUB_OUTPUT"
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "generate_release_notes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: ${{ steps.release_notes.outputs.generate_release_notes }}
          body_path: ${{ steps.release_notes.outputs.body_path }}
